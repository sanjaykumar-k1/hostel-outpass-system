<!DOCTYPE html>
<html>
<head>
    <title>My ID</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="{% url 'home' %}">Hostel Outpass System</a>
</nav>
<div class="container mt-4" style="max-width: 380px;">
    <div class="card shadow text-center p-4">
        {% if student.photo %}
            <img src="{{ student.photo.url }}" class="rounded mx-auto mb-3" style="width:120px;height:120px;object-fit:cover;">
        {% endif %}
        <h5>{{ student.user.username }}</h5>
        <p class="mb-1">ID: <b>{{ student.student_id }}</b></p>
        <p>Room: {{ student.room_no }}</p>
        <img src="{% url 'my_qr' %}" class="mx-auto" style="width:220px;">
        <small class="text-muted mt-2">Show this QR at the gate</small>
    </div>
</div>
</body>
</html>
