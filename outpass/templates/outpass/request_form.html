<!DOCTYPE html>
<html>
<head>
    <title>Request Outpass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="{% url 'home' %}">Hostel Outpass System</a>
</nav>
<div class="container mt-4" style="max-width: 600px;">
    <div class="card shadow p-4">
        <h4 class="mb-3">Request Outpass</h4>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Reason</label>
                {{ form.reason }}
                {{ form.reason.errors }}
            </div>
            <div class="mb-3">
                <label class="form-label">Out date and time</label>
                {{ form.out_date }}
                {{ form.out_date.errors }}
            </div>
            <div class="mb-3">
                <label class="form-label">Expected return</label>
                {{ form.expected_return }}
                {{ form.expected_return.errors }}
            </div>
            <button class="btn btn-primary">Submit</button>
            <a href="{% url 'home' %}" class="btn btn-secondary">Back</a>
        </form>
    </div>
</div>
</body>
</html>
